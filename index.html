<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#061a35">

    <title>🚀 Sky Multiplier - Virtual Demo</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255,255,255,.18) 0 2px,
                    transparent 3px
                ),
                radial-gradient(
                    circle at 70% 22%,
                    rgba(255,255,255,.15) 0 2px,
                    transparent 3px
                ),
                radial-gradient(
                    circle at 35% 55%,
                    rgba(255,255,255,.12) 0 2px,
                    transparent 3px
                ),
                radial-gradient(
                    circle at 88% 70%,
                    rgba(255,255,255,.16) 0 2px,
                    transparent 3px
                ),
                linear-gradient(
                    180deg,
                    #020d20 0%,
                    #06345f 35%,
                    #0879a9 68%,
                    #45c4e6 100%
                );

            background-attachment: fixed;
        }

        button,
        input {
            touch-action: manipulation;
        }

        .app {
            width: min(1200px, 100%);
            margin: auto;
            padding: 14px;
        }

        h1 {
            margin: 5px 0 8px;
            text-align: center;
            font-size: clamp(24px, 5vw, 42px);
            font-weight: 900;

            text-shadow:
                0 0 10px rgba(100,210,255,.6),
                0 0 30px rgba(60,150,255,.35);
        }

        .badge {
            width: fit-content;
            margin: 0 auto 15px;
            padding: 7px 14px;
            border-radius: 30px;

            background: rgba(255,255,255,.09);
            border: 1px solid rgba(255,255,255,.15);

            color: #bce7ff;
            font-size: 13px;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* =========================
           BALANCE
        ========================= */

        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 13px;
        }

        .balance-box {
            width: min(500px, 100%);
            padding: 15px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.11),
                    rgba(255,255,255,.04)
                );

            border: 1px solid rgba(160,225,255,.25);

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.08);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .balance-box strong {
            display: inline-block;
            margin-left: 5px;
            font-size: clamp(21px, 5vw, 30px);
        }

        /* =========================
           MAIN PANEL
        ========================= */

        .panel {
            padding: 18px;
            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(5,22,45,.94),
                    rgba(5,47,75,.88)
                );

            border: 1px solid rgba(130,220,255,.32);

            box-shadow:
                0 25px 70px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* =========================
           GAME AREA
        ========================= */

        #gameArea {
            position: relative;
            width: 100%;
            height: clamp(330px, 55vw, 560px);
            min-height: 300px;

            overflow: hidden;

            border-radius: 21px;

            background:
                radial-gradient(
                    ellipse at 20% 25%,
                    rgba(255,255,255,.18),
                    transparent 20%
                ),
                radial-gradient(
                    ellipse at 75% 35%,
                    rgba(255,255,255,.13),
                    transparent 22%
                ),
                radial-gradient(
                    ellipse at 50% 85%,
                    rgba(255,255,255,.09),
                    transparent 30%
                ),
                linear-gradient(
                    160deg,
                    #02132d 0%,
                    #064c7c 40%,
                    #0786b6 72%,
                    #55c9e9 100%
                );

            border: 1px solid rgba(150,230,255,.4);

            box-shadow:
                inset 0 0 80px rgba(0,0,0,.28),
                0 15px 45px rgba(0,0,0,.35);
        }

        /* Stars */

        #gameArea::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    white 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 25% 65%,
                    white 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 43% 30%,
                    white 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 62% 72%,
                    white 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 78% 18%,
                    white 0 1px,
                    transparent 2px
                ),
                radial-gradient(
                    circle at 91% 52%,
                    white 0 1px,
                    transparent 2px
                );

            opacity: .65;
            pointer-events: none;
        }

        /* Clouds */

        #gameArea::after {
            content: "☁️        ☁️              ☁️";

            position: absolute;
            left: -10%;
            bottom: 7%;

            width: 120%;
            height: 70px;

            font-size: clamp(35px, 7vw, 70px);
            letter-spacing: 35px;

            opacity: .18;
            white-space: nowrap;

            animation: cloudsMove 35s linear infinite;

            pointer-events: none;
        }

        @keyframes cloudsMove {
            from {
                transform: translateX(-5%);
            }

            to {
                transform: translateX(5%);
            }
        }

        /* =========================
           MULTIPLIER
        ========================= */

        #multiplier {
            position: absolute;
            z-index: 10;

            top: 22px;
            left: 0;
            right: 0;

            text-align: center;

            font-size: clamp(45px, 10vw, 88px);
            font-weight: 900;

            color: #fff;

            text-shadow:
                0 0 10px rgba(255,255,255,.7),
                0 0 25px rgba(75,190,255,.9),
                0 0 55px rgba(30,150,255,.55);
        }

        .multiplier-pop {
            animation: multiplierPop .18s ease;
        }

        @keyframes multiplierPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================
           COUNTDOWN
        ========================= */

        #countdown {
            position: absolute;
            z-index: 20;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            display: none;

            font-size: clamp(45px, 12vw, 95px);
            font-weight: 900;

            text-align: center;

            text-shadow:
                0 0 15px rgba(100,210,255,.9),
                0 0 45px rgba(60,170,255,.8);
        }

        .countdown-pop {
            animation: countdownPop .5s ease;
        }

        @keyframes countdownPop {
            0% {
                transform:
                    translate(-50%, -50%)
                    scale(.5);
                opacity: .2;
            }

            60% {
                transform:
                    translate(-50%, -50%)
                    scale(1.25);
                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        .go-pop {
            animation: goPop .7s ease;
        }

        @keyframes goPop {
            0% {
                transform:
                    translate(-50%, -50%)
                    scale(.3);
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.35);
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        /* =========================
           PLANE
        ========================= */

        #plane {
            position: absolute;

            left: 3%;
            bottom: 7%;

            z-index: 8;

            font-size: clamp(40px, 9vw, 75px);

            transform-origin: center;

            transition:
                transform .1s linear;

            filter:
                drop-shadow(0 0 8px #62dcff)
                drop-shadow(0 0 18px rgba(82,217,255,.8));

            will-change: transform;
        }

        #plane::after {
            content: "";

            position: absolute;

            width: 90px;
            height: 5px;

            left: -80px;
            top: 50%;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(100,225,255,.85)
                );

            opacity: 0;
        }

        .plane-flying::after {
            opacity: 1;
        }

        .plane-crashed {
            animation: planeCrash .8s ease forwards;
        }

        @keyframes planeCrash {
            0% {
                transform:
                    rotate(-15deg)
                    scale(1);
            }

            40% {
                transform:
                    rotate(20deg)
                    scale(1.05);
            }

            100% {
                transform:
                    translateY(130px)
                    rotate(65deg)
                    scale(.7);

                opacity: .2;
            }
        }

        /* =========================
           STATUS
        ========================= */

        #status {
            min-height: 28px;
            margin-top: 13px;

            text-align: center;

            font-size: clamp(14px, 3.5vw, 19px);
            font-weight: 800;
        }

        .win-text {
            color: #59ff9b;
            animation: winText .7s ease;
        }

        .crash-text {
            color: #ff5555;
            animation: crashText .7s ease;
        }

        @keyframes winText {
            0% {
                transform: scale(.7);
                opacity: .3;
            }

            60% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes crashText {
            0% {
                transform: scale(.7);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: grid;

            grid-template-columns:
                minmax(130px, 1.3fr)
                repeat(4, minmax(100px, 1fr));

            gap: 10px;

            margin-top: 15px;
        }

        .bet-input {
            width: 100%;
            min-height: 54px;

            padding: 10px 13px;

            border-radius: 13px;

            border: 1px solid rgba(255,255,255,.15);

            background:
                rgba(5,20,38,.9);

            color: #fff;

            font-size: 18px;
            outline: none;
        }

        .bet-input:focus {
            border-color: #55d2ff;

            box-shadow:
                0 0 15px rgba(85,201,255,.3);
        }

        button {
            width: 100%;
            min-height: 54px;

            border: 0;
            border-radius: 13px;

            padding: 10px 12px;

            background: #2468ff;
            color: #fff;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform .12s ease,
                filter .12s ease,
                opacity .12s ease;

            box-shadow:
                0 7px 18px rgba(0,0,0,.22);
        }

        button:hover {
            filter: brightness(1.15);
        }

        button:active {
            transform:
                translateY(3px)
                scale(.98);
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        #betButton {
            background: #168d55;
        }

        #cashOutButton {
            background: #e49a20;
        }

        #cancelButton {
            background: #d75b35;
        }

        #depositButton {
            background: #3158d8;
        }

        #resetButton {
            background: #555f70;
        }

        #soundButton {
            background: #6148bd;
        }

        #autoPlayButton {
            background: #963fc0;
        }

        #stopAutoButton {
            background: #b93845;
        }

        /* =========================
           EXTRA CONTROLS
        ========================= */

        .extra-controls {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 10px;
        }

        /* =========================
           INFO
        ========================= */

        .info {
            display: flex;

            justify-content: space-between;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 13px;
        }

        .info-box {
            flex: 1;
            min-width: 180px;

            padding: 13px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid rgba(255,255,255,.08);

            text-align: center;
        }

        .info-box strong {
            font-size: 19px;
        }

        /* =========================
           AUTO PLAY
        ========================= */

        .auto-panel {
            margin-top: 15px;

            padding: 15px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(130,70,180,.12),
                    rgba(40,80,160,.08)
                );

            border:
                1px solid rgba(180,100,255,.22);
        }

        .auto-title {
            margin-bottom: 11px;

            font-size: 19px;
            font-weight: 900;
        }

        .auto-grid {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 10px;
        }

        .auto-field {
            display: flex;

            flex-direction: column;

            gap: 6px;

            font-size: 12px;

            color: #c5d8f2;
        }

        .auto-field input {
            width: 100%;
            min-height: 43px;

            border-radius: 9px;

            border:
                1px solid rgba(255,255,255,.12);

            background: #101e33;

            color: #fff;

            padding: 8px;
        }

        .check-field {
            display: flex;

            align-items: center;

            gap: 8px;

            min-height: 43px;
        }

        .check-field input {
            width: 18px;
            height: 18px;
        }

        #autoStatus {
            margin-top: 10px;

            text-align: center;

            font-weight: 800;

            color: #d8b7ff;
        }

        /* =========================
           HISTORY
        ========================= */

        .history-panel {
            margin-top: 15px;

            padding: 15px;

            border-radius: 16px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid rgba(255,255,255,.08);

            overflow-x: auto;
        }

        .history-title {
            margin-bottom: 10px;

            font-size: 20px;
            font-weight: 900;
        }

        .history-row {
            display: grid;

            grid-template-columns:
                60px
                90px
                80px
                100px
                110px;

            gap: 8px;

            min-width: 450px;

            padding: 9px 6px;

            border-bottom:
                1px solid rgba(255,255,255,.08);

            font-size: 14px;
        }

        .history-empty {
            padding: 20px;

            text-align: center;

            color: #91a4bf;
        }

        /* =========================
           EFFECTS
        ========================= */

        .crash-flash {
            animation: crashFlash .6s ease;
        }

        @keyframes crashFlash {
            0% {
                filter: brightness(1);
            }

            30% {
                filter: brightness(1.8);
            }

            100% {
                filter: brightness(1);
            }
        }

        .screen-shake {
            animation: screenShake .55s ease;
        }

        @keyframes screenShake {
            0%,100% {
                transform: translate(0,0);
            }

            20% {
                transform: translate(-8px,4px);
            }

            40% {
                transform: translate(8px,-4px);
            }

            60% {
                transform: translate(-6px,-3px);
            }

            80% {
                transform: translate(6px,3px);
            }
        }

        .win-flash {
            animation: winFlash .7s ease;
        }

        @keyframes winFlash {
            0% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.5);
            }

            100% {
                filter: brightness(1);
            }
        }

        /* =========================
           CONFETTI
        ========================= */

        .confetti-container {
            position: fixed;

            inset: 0;

            z-index: 9999;

            pointer-events: none;

            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;

            top: -20px;

            font-size: 20px;

            animation:
                confettiFall 2s linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }

        /* =========================
           SMOKE
        ========================= */

        .smoke-particle {
            position: absolute;

            width: 16px;
            height: 16px;

            border-radius: 50%;

            background:
                rgba(70,70,70,.75);

            z-index: 15;

            animation:
                smokeRise 1.6s ease forwards;
        }

        @keyframes smokeRise {
            0% {
                transform: scale(.5);
                opacity: .8;
            }

            100% {
                transform:
                    translate(
                        calc(-50px + 100px * var(--random,.5)),
                        -100px
                    )
                    scale(2.5);

                opacity: 0;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .app {
                width: 100%;
                padding: 8px;
            }

            .panel {
                padding: 9px;
                border-radius: 18px;
            }

            #gameArea {
                height: 62vh;
                min-height: 300px;
                max-height: 520px;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }

            .controls input {
                grid-column: 1 / -1;
            }

            button {
                min-height: 52px;
                font-size: 14px;
            }

            .extra-controls {
                grid-template-columns: 1fr 1fr;
            }

            .auto-grid {
                grid-template-columns: 1fr 1fr;
            }

            .info {
                flex-direction: column;
            }

            .info-box {
                min-width: 100%;
            }
        }

        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            h1 {
                font-size: 23px;
            }

            #gameArea {
                height: 300px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .controls input,
            #betButton,
            #cashOutButton,
            #cancelButton,
            #depositButton {
                grid-column: 1;
            }

            .extra-controls {
                grid-template-columns: 1fr;
            }

            .auto-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =========================
           TABLETS
        ========================= */

        @media (min-width: 601px) and (max-width: 1024px) {

            .app {
                width: 96%;
                max-width: 950px;
            }

            #gameArea {
                height: 500px;
            }

            .controls {
                grid-template-columns:
                    1.2fr
                    1fr
                    1fr
                    1fr
                    1fr;
            }
        }

        /* =========================
           COMPUTER
        ========================= */

        @media (min-width: 1025px) {

            .app {
                width: 94%;
                max-width: 1200px;
            }

            #gameArea {
                height: 560px;
            }

            .panel {
                padding: 22px;
            }

            button {
                min-height: 55px;
            }
        }

        /* =========================
           LANDSCAPE PHONE
        ========================= */

        @media (max-width: 900px)
        and (orientation: landscape) {

            #gameArea {
                height: 75vh;
                min-height: 280px;
            }
        }

        /* =========================
           IPHONE SAFE AREA
        ========================= */

        @supports (padding: max(0px)) {

            .app {
                padding-left:
                    max(9px, env(safe-area-inset-left));

                padding-right:
                    max(9px, env(safe-area-inset-right));

                padding-bottom:
                    max(15px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🚀 Sky Multiplier</h1>

    <div class="badge">
        Virtual Credits • Demo Simulation
    </div>

    <!-- BALANCE -->

    <div class="top-bar">

        <div class="balance-box">
            💰 Balance:
            <strong id="balance">1,000.00</strong>
        </div>

    </div>

    <!-- MAIN PANEL -->

    <div class="panel">

        <!-- GAME -->

        <div id="gameArea">

            <div id="multiplier">
                1.00x
            </div>

            <div id="countdown"></div>

            <div id="plane">
                ✈️
            </div>

        </div>

        <!-- STATUS -->

        <div id="status">
            🎮 Game Ready — 1.00x
        </div>

        <!-- CONTROLS -->

        <div class="controls">

            <input
                id="betAmount"
                class="bet-input"
                type="number"
                min="1"
                step="1"
                value="100"
                placeholder="Bet Amount"
            >

            <button id="betButton">
                🟢 BET
            </button>

            <button
                id="cashOutButton"
                disabled
            >
                💰 CASH OUT
            </button>

            <button
                id="cancelButton"
                disabled
            >
                ❌ CANCEL
            </button>

            <button id="depositButton">
                💵 DEPOSIT
            </button>

        </div>

        <!-- EXTRA -->

        <div class="extra-controls">

            <button onclick="halfBet()">
                ½ BET
            </button>

            <button onclick="doubleBet()">
                2× BET
            </button>

            <button id="soundButton">
                🔊 SOUND ON
            </button>

            <button id="resetButton">
                🔄 RESET
            </button>

        </div>

        <!-- INFO -->

        <div class="info">

            <div class="info-box">
                📈 Multiplier
                <br>
                <strong id="infoMultiplier">
                    1.00x
                </strong>
            </div>

            <div class="info-box">
                🎮 Game
                <br>
                <strong id="gameState">
                    Ready
                </strong>
            </div>

        </div>

        <!-- AUTO PLAY -->

        <div class="auto-panel">

            <div class="auto-title">
                🤖 AUTO PLAY SETTINGS
            </div>

            <div class="auto-grid">

                <label class="auto-field">
                    Bet Amount

                    <input
                        id="autoBetAmount"
                        type="number"
                        min="1"
                        value="50"
                    >
                </label>

                <label class="auto-field">
                    Auto Cash Out

                    <input
                        id="autoCashOut"
                        type="number"
                        min="1"
                        step="0.01"
                        value="2.00"
                    >
                </label>

                <label class="auto-field">
                    Number of Rounds

                    <input
                        id="autoRounds"
                        type="number"
                        min="1"
                        value="4"
                    >
                </label>

                <label class="auto-field">
                    Stop on Loss

                    <span class="check-field">

                        <input
                            id="stopOnLoss"
                            type="checkbox"
                        >

                        ON

                    </span>

                </label>

                <label class="auto-field">
                    Stop on Profit

                    <input
                        id="stopOnProfit"
                        type="number"
                        min="0"
                        step="1"
                        value="0"
                        placeholder="0 = OFF"
                    >
                </label>

            </div>
